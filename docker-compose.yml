services:
  postgres:
    image: postgres:16
    container_name: zabbix-report-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - report_net

  redis:
    image: redis:7-alpine
    container_name: zabbix-report-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - report_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zabbix-report-backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
      - ./certs:/run/zabbix-certs:ro
    depends_on:
      - postgres
      - redis
    networks:
      - report_net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zabbix-report-worker
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
      - ./certs:/run/zabbix-certs:ro
    depends_on:
      - backend
      - postgres
      - redis
    command:
      [
        "python",
        "-m",
        "app.services.scheduler.scheduler"
      ]
    networks:
      - report_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zabbix-report-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - report_net

  nginx:
    image: nginx:alpine
    container_name: zabbix-report-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - report_net

volumes:
  postgres_data:

networks:
  report_net:
    driver: bridge