events {}

http {
    # Follow Docker DNS when rebuilt containers receive new IP addresses.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    upstream frontend {
        zone frontend 64k;
        server frontend:3000 resolve;
    }

    upstream backend {
        zone backend 64k;
        server backend:8000 resolve;
    }

    server {
        listen 80;
        client_max_body_size 1m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

        location /api/ {
            proxy_read_timeout 240s;
            proxy_send_timeout 240s;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /_auth {
            internal;
            proxy_pass http://backend/api/v1/auth/check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /login {
            proxy_pass http://frontend;
            proxy_set_header Host $http_host;
            add_header Cache-Control "no-store" always;
            add_header X-Frame-Options DENY always;
            add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
        }

        location /_next/ {
            proxy_pass http://frontend;
            proxy_set_header Host $http_host;
        }

        location /brand/ {
            proxy_pass http://frontend;
        }

        location / {
            auth_request /_auth;
            error_page 401 = @login_redirect;
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location @login_redirect {
            return 302 /login;
        }
    }
}
